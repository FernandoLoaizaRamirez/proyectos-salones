name: CI

# Se ejecuta en cada push a main y en cada Pull Request. Es la primera "malla de
# seguridad" automática del proyecto: instala y corre las pruebas.
#
# Nota: el `lint` NO se incluye todavía porque las apps usan `next lint`, comando
# que Next.js 16 eliminó (queda roto en todo el repo, deuda previa). Se volverá a
# activar cuando se migren los scripts de lint a ESLint directo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Correr pruebas
        run: pnpm test
        # La suite de AISLAMIENTO (tests/aislamiento/) prueba contra el Supabase
        # real y necesita estas dos variables PÚBLICAS. Si faltan, esos tests se
        # SALTAN solos (los unitarios siguen corriendo); con ellas, se ejecutan.
        #
        # Crea estos dos secrets en GitHub una sola vez:
        #   Repo → Settings → Secrets and variables → Actions → New repository secret
        #     · NEXT_PUBLIC_SUPABASE_URL       = https://cpbfisylcquuahrmyaca.supabase.co
        #     · NEXT_PUBLIC_SUPABASE_ANON_KEY  = la llave "publishable/anon" pública del proyecto
        #   (Son públicas por diseño —viajan en el navegador—; van como secrets solo
        #    por comodidad y para no fijarlas en el archivo.)
        #
        # EXIGIR_SEGURIDAD=1 → el CENTINELA (tests/aislamiento/centinela.test.ts)
        # deja de ser informativo y se vuelve un CANDADO: si alguna de las 6 piezas
        # de seguridad se apaga (una migración revertida, una función caída o
        # borrada), el CI se pone ROJO en vez de saltarse las pruebas en silencio.
        #
        # Se enciende el 21 jul 2026, cuando las 6 piezas quedaron desplegadas y
        # verificadas ("Todas las piezas están encendidas", 53 pruebas pasando).
        # ANTES de esa fecha habría dado un rojo permanente sin utilidad.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXIGIR_SEGURIDAD: 1
